services:
  transcode-harbor:
    container_name: transcode-harbor
    build:
      context: .
      dockerfile: Dockerfile

    restart: always

    cap_add:
      - SYS_NICE

    environment:
      - PARALLEL_JOBS=1
      - ADMIN_PORT=8080
      - UNRAID_UID=1000
      - UNRAID_GID=1000

    volumes:
      - ./media:/media:ro # mount your whole media library read-only
      - ./export:/export
      - ./config:/config

    ports:
      - "8080:8080"

    # --- Intel QuickSync / Arc (uncomment to enable VAAPI) ---
    # devices:
    #   - /dev/dri:/dev/dri
